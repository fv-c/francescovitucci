    <script>
      const storedTheme = localStorage.getItem('fv-site-theme');
      const initialTheme =
        storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      document.documentElement.dataset.theme = initialTheme;

      const normalizeLanguage = (value) => {
        const tag = String(value || '').trim().toLowerCase();
        if (tag === 'it' || tag.indexOf('it-') === 0 || tag === 'ita') return 'it';
        if (tag === 'en' || tag.indexOf('en-') === 0 || tag === 'eng') return 'en';
        return undefined;
      };
      const browserLanguage = () => {
        const candidates = (navigator.languages || []).concat(navigator.language || []);
        for (let index = 0; index < candidates.length; index += 1) {
          const resolved = normalizeLanguage(candidates[index]);
          if (resolved) return resolved;
        }
        return undefined;
      };
      document.documentElement.lang =
        normalizeLanguage(new URLSearchParams(window.location.search).get('lang')) ||
        normalizeLanguage(localStorage.getItem('fv-site-lang')) ||
        browserLanguage() ||
        'en';
    </script>
